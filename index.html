<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BurgzGo - Controle Completo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --vermelho-escuro: #8B0000;
      --amarelo-mostarda: #FFD700;
      --cinza-escuro: #2F4F4F;
      --branco: #FFFFFF;
    }
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      max-width: 1000px;
      margin: auto;
      background-color: var(--branco);
      color: var(--cinza-escuro);
      font-size: 1rem;
    }
    .section {
      margin-bottom: 2rem;
      border: 1px solid var(--cinza-escuro);
      padding: 1rem;
      border-radius: 5px;
      background-color: var(--branco);
    }
    input, button, select {
      margin: 0.5rem;
      padding: 0.5rem;
      border: 1px solid var(--cinza-escuro);
      border-radius: 4px;
      font-size: 0.9rem;
    }
    button {
      background-color: var(--vermelho-escuro);
      color: var(--branco);
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #A10000;
    }
    button.icon {
      background-color: transparent;
      color: var(--amarelo-mostarda);
      border: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    th, td {
      border: 1px solid var(--cinza-escuro);
      padding: 0.5rem;
      text-align: left;
      font-size: 0.9rem;
    }
    th {
      background-color: var(--vermelho-escuro);
      color: var(--branco);
    }
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    h1 {
      color: var(--vermelho-escuro);
      font-size: 1.8rem;
    }
    h2 {
      color: var(--vermelho-escuro);
      font-size: 1.4rem;
    }
    .lucro-liquido {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--amarelo-mostarda);
      background-color: var(--cinza-escuro);
      padding: 0.7rem;
      border-radius: 5px;
      margin: 0.7rem 0;
    }
    .error {
      color: red;
      font-size: 0.8rem;
      margin: 0.3rem;
    }
    .sugestao-preco {
      margin: 0.5rem;
      font-style: italic;
      color: var(--cinza-escuro);
    }
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--cinza-escuro);
    }
    #loginScreen input {
      width: 250px;
      margin: 0.5rem 0;
    }
    #mainContent {
      display: none;
    }
    @media (max-width: 768px) {
      body {
        padding: 1rem;
        font-size: 0.9rem;
      }
      .section {
        padding: 0.7rem;
      }
      input, button, select {
        font-size: 0.8rem;
        padding: 0.4rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        font-size: 1.2rem;
      }
      .charts {
        grid-template-columns: 1fr;
      }
      table, th, td {
        font-size: 0.8rem;
      }
      .lucro-liquido {
        font-size: 1rem;
      }
    }
    @media (max-width: 480px) {
      input, button, select {
        display: block;
        width: 100%;
        margin: 0.3rem 0;
      }
      button {
        padding: 0.6rem;
      }
      table {
        font-size: 0.7rem;
      }
      #loginScreen input {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div id="loginScreen">
    <h1>BurgzGo - Login</h1>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="senha" placeholder="Senha" />
    <div id="erroLogin" class="error"></div>
    <button onclick="login()">Entrar</button>
  </div>

  <div id="mainContent">
    <h1>BurgzGo - Painel Financeiro</h1>
    <button onclick="logout()">Sair</button>

    <!-- Seção: Custos -->
    <div class="section">
      <h2>🍔 Hambúrgueres</h2>
      <div>
        <input type="text" id="nomeHamburguer" placeholder="Nome" />
        <input type="number" id="custoHamburguer" placeholder="Custo (R$)" min="0" step="0.01" oninput="sugerirPreco()" />
        <input type="number" id="margem" placeholder="Margem (%)" min="0" step="0.1" oninput="sugerirPreco()" />
        <input type="number" id="estoque" placeholder="Estoque (unid)" min="0" step="1" />
        <button onclick="salvarHamburguer()">Calcular Preço</button>
        <button onclick="exportarTabela('hamburguers')">📁 Exportar</button>
        <button onclick="exportarRelatorioConsolidado()">📊 Relatório Consolidado</button>
        <button onclick="gerarBackup()">💾 Gerar Backup</button>
      </div>
      <div id="sugestaoPreco" class="sugestao-preco"></div>
      <div id="erroHamburguer" class="error"></div>
      <table id="tabelaHamburguers">
        <tr><th>Nome</th><th>Custo</th><th>Margem</th><th>Preço</th><th>Lucro</th><th>Estoque</th><th>Ações</th></tr>
      </table>
    </div>

    <!-- Seção: Despesas -->
    <div class="section">
      <h2>💸 Despesas</h2>
      <div>
        <select id="tipoDespesa">
          <option value="fixa">Fixa</option>
          <option value="variavel">Variável</option>
        </select>
        <input type="text" id="descDespesa" placeholder="Descrição" />
        <input type="number" id="valorDespesa" placeholder="Valor (R$)" min="0" step="0.01" />
        <input type="date" id="dataDespesa" />
        <input type="text" id="fornecedorDespesa" placeholder="Fornecedor" />
        <select id="formaPagamentoDespesa">
          <option value="dinheiro">Dinheiro</option>
          <option value="cartao_credito">Cartão de Crédito</option>
          <option value="cartao_debito">Cartão de Débito</option>
          <option value="pix">Pix</option>
          <option value="boleto">Boleto</option>
        </select>
        <button onclick="salvarDespesa()">Salvar</button>
        <button onclick="exportarTabela('despesas')">📁 Exportar</button>
      </div>
      <div id="erroDespesa" class="error"></div>
      <div>
        <label>Filtrar por período:</label>
        <input type="date" id="filtroDataInicioDespesa" />
        <input type="date" id="filtroDataFimDespesa" />
        <button onclick="carregarDados()">Filtrar</button>
      </div>
      <table id="tabelaDespesas">
        <tr><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Data</th><th>Fornecedor</th><th>Forma de Pagamento</th><th>Ações</th></tr>
      </table>
    </div>

    <!-- Seção: Vendas -->
    <div class="section">
      <h2>🛒 Vendas</h2>
      <div>
        <input type="text" id="nomeVenda" placeholder="Hambúrguer Vendido" />
        <input type="number" id="qtdVenda" placeholder="Quantidade" min="1" step="1" />
        <input type="date" id="dataVenda" />
        <button onclick="registrarVenda()">Registrar Venda</button>
      </div>
      <div id="erroVenda" class="error"></div>
      <div>
        <label>Filtrar por período:</label>
        <input type="date" id="filtroDataInicioVenda" />
        <input type="date" id="filtroDataFimVenda" />
        <button onclick="carregarDados()">Filtrar</button>
      </div>
      <table id="tabelaVendas">
        <tr><th>Produto</th><th>Qtd</th><th>Total</th><th>Data</th></tr>
      </table>
    </div>

    <!-- Seção: Dashboard -->
    <div class="section">
      <h2>📊 Dashboard</h2>
      <div class="lucro-liquido" id="lucroLiquido">Lucro Líquido: R$ 0.00</div>
      <div>
        <label>Selecionar Mês/Ano:</label>
        <input type="month" id="filtroMesLucro" />
        <button onclick="calcularLucroMensal()">Calcular Lucro Mensal</button>
      </div>
      <div class="charts">
        <canvas id="graficoLucros"></canvas>
        <canvas id="graficoDespesas"></canvas>
      </div>
    </div>

    <!-- Seção: Configurações -->
    <div class="section">
      <h2>⚙️ Configurações</h2>
      <button onclick="limparBanco()">🧹 Limpar Banco de Dados</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALTx6uyV6-_jrKVDSRkbY8lGYCeT5GMCs",
      authDomain: "burgzgo.firebaseapp.com",
      projectId: "burgzgo",
      storageBucket: "burgzgo.firebasestorage.app",
      messagingSenderId: "48648800415",
      appId: "1:48648800415:web:5f7843f4ab8f182ee73aaa"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    const auth = firebase.auth();
    let chartLucros, chartDespesas;

    function mostrarErro(id, mensagem) {
      document.getElementById(id).innerText = mensagem;
      setTimeout(() => document.getElementById(id).innerText = '', 5000);
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      if (!email || !senha) return mostrarErro('erroLogin', 'Preencha email e senha.');

      try {
        await auth.signInWithEmailAndPassword(email, senha);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        carregarDados();
      } catch (error) {
        mostrarErro('erroLogin', 'Credenciais inválidas ou erro de conexão.');
      }
    }

    async function logout() {
      await auth.signOut();
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('email').value = '';
      document.getElementById('senha').value = '';
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        carregarDados();
      } else {
        document.getElementById('mainContent').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
      }
    });

    async function sugerirPreco() {
      const custo = parseFloat(document.getElementById('custoHamburguer').value) || 0;
      const margem = parseFloat(document.getElementById('margem').value) || 0;
      if (!custo) return;

      const snapshot = await db.collection('hamburguers').get();
      const precos = snapshot.docs.map(doc => doc.data().preco);
      const custoMedio = snapshot.docs.reduce((sum, doc) => sum + doc.data().custo, 0) / (snapshot.docs.length || 1);
      const margemMedia = snapshot.docs.reduce((sum, doc) => sum + doc.data().margem, 0) / (snapshot.docs.length || 1);

      const precoSugerido = custo * (1 + (margem || margemMedia) / 100);
      const precoMercado = precos.length ? precos.reduce((sum, p) => sum + p, 0) / precos.length : precoSugerido;
      const precoFinal = (precoSugerido + precoMercado) / 2;

      document.getElementById('sugestaoPreco').innerText = `Preço sugerido: R$ ${precoFinal.toFixed(2)} (baseado em custo médio R$ ${custoMedio.toFixed(2)} e margem média ${margemMedia.toFixed(1)}%)`;
    }

    async function salvarHamburguer() {
      const nome = document.getElementById('nomeHamburguer').value.trim();
      const custo = parseFloat(document.getElementById('custoHamburguer').value);
      const margem = parseFloat(document.getElementById('margem').value);
      const estoque = parseInt(document.getElementById('estoque').value);

      if (!nome) return mostrarErro('erroHamburguer', 'Nome é obrigatório.');
      if (isNaN(custo) || custo < 0) return mostrarErro('erroHamburguer', 'Custo deve ser um número positivo.');
      if (isNaN(margem) || margem < 0) return mostrarErro('erroHamburguer', 'Margem deve ser um número positivo.');
      if (isNaN(estoque) || estoque < 0) return mostrarErro('erroHamburguer', 'Estoque deve ser um número não negativo.');

      const preco = custo * (1 + margem / 100);
      const lucroUn = preco - custo;

      await db.collection('hamburguers').add({ nome, custo, margem, preco, lucroUn, estoque, timestamp: new Date() });
      document.getElementById('nomeHamburguer').value = '';
      document.getElementById('custoHamburguer').value = '';
      document.getElementById('margem').value = '';
      document.getElementById('estoque').value = '';
      document.getElementById('sugestaoPreco').innerText = '';
    }

    async function salvarDespesa() {
      const tipo = document.getElementById('tipoDespesa').value;
      const descricao = document.getElementById('descDespesa').value.trim();
      const valor = parseFloat(document.getElementById('valorDespesa').value);
      const dataDespesa = document.getElementById('dataDespesa').value || new Date().toISOString().split('T')[0];
      const fornecedor = document.getElementById('fornecedorDespesa').value.trim();
      const formaPagamento = document.getElementById('formaPagamentoDespesa').value;

      if (!descricao) return mostrarErro('erroDespesa', 'Descrição é obrigatória.');
      if (isNaN(valor) || valor < 0) return mostrarErro('erroDespesa', 'Valor deve ser um número positivo.');
      if (!fornecedor) return mostrarErro('erroDespesa', 'Fornecedor é obrigatório.');

      await db.collection('despesas').add({
        tipo,
        descricao,
        valor,
        data: new Date(dataDespesa),
        fornecedor,
        formaPagamento,
        timestamp: new Date()
      });
      document.getElementById('descDespesa').value = '';
      document.getElementById('valorDespesa').value = '';
      document.getElementById('dataDespesa').value = '';
      document.getElementById('fornecedorDespesa').value = '';
      document.getElementById('formaPagamentoDespesa').value = 'dinheiro';
    }

    async function registrarVenda() {
      const nome = document.getElementById('nomeVenda').value.trim();
      const qtd = parseInt(document.getElementById('qtdVenda').value);
      const dataVenda = document.getElementById('dataVenda').value || new Date().toISOString().split('T')[0];

      if (!nome) return mostrarErro('erroVenda', 'Nome do hambúrguer é obrigatório.');
      if (isNaN(qtd) || qtd <= 0) return mostrarErro('erroVenda', 'Quantidade deve ser um número positivo.');

      const ref = await db.collection('hamburguers').where("nome", "==", nome).get();
      if (ref.empty) return mostrarErro('erroVenda', 'Hambúrguer não encontrado.');

      const doc = ref.docs[0];
      const data = doc.data();
      if (data.estoque < qtd) return mostrarErro('erroVenda', 'Estoque insuficiente.');

      const total = data.preco * qtd;
      const novoEstoque = data.estoque - qtd;
      await db.collection('hamburguers').doc(doc.id).update({ estoque: novoEstoque });

      await db.collection('vendas').add({ nome, qtd, total, data: new Date(dataVenda), timestamp: new Date() });
      document.getElementById('nomeVenda').value = '';
      document.getElementById('qtdVenda').value = '';
      document.getElementById('dataVenda').value = '';
    }

    async function deletarDocumento(colecao, id) {
      await db.collection(colecao).doc(id).delete();
    }

    async function limparBanco() {
      if (confirm("Tem certeza que deseja apagar todos os dados?")) {
        const colecoes = ['hamburguers', 'despesas', 'vendas'];
        for (const col of colecoes) {
          const snap = await db.collection(col).get();
          const promises = snap.docs.map(doc => db.collection(col).doc(doc.id).delete());
          await Promise.all(promises);
        }
      }
    }

    function carregarDados() {
      const filtroInicioDespesa = document.getElementById('filtroDataInicioDespesa').value;
      const filtroFimDespesa = document.getElementById('filtroDataFimDespesa').value;
      const filtroInicioVenda = document.getElementById('filtroDataInicioVenda').value;
      const filtroFimVenda = document.getElementById('filtroDataFimVenda').value;

      // Hamburguers
      db.collection('hamburguers').onSnapshot(snapshot => {
        let htmlH = "<tr><th>Nome</th><th>Custo</th><th>Margem</th><th>Preço</th><th>Lucro</th><th>Estoque</th><th>Ações</th></tr>";
        snapshot.forEach(doc => {
          const d = doc.data();
          htmlH += `<tr><td contenteditable onblur="editarCampo('${doc.id}', 'hamburguers', 'nome', this)">${d.nome}</td><td contenteditable onblur="editarCampo('${doc.id}', 'hamburguers', 'custo', this)">R$${d.custo.toFixed(2)}</td><td contenteditable onblur="editarCampo('${doc.id}', 'hamburguers', 'margem', this)">${d.margem}%</td><td>R$${d.preco.toFixed(2)}</td><td>R$${d.lucroUn.toFixed(2)}</td><td contenteditable onblur="editarCampo('${doc.id}', 'hamburguers', 'estoque', this)">${d.estoque}</td><td><button class="icon" onclick="deletarDocumento('hamburguers', '${doc.id}')">🗑️</button></td></tr>`;
        });
        document.getElementById('tabelaHamburguers').innerHTML = htmlH;
      });

      // Despesas
      let queryD = db.collection('despesas');
      if (filtroInicioDespesa) queryD = queryD.where('data', '>=', new Date(filtroInicioDespesa));
      if (filtroFimDespesa) queryD = queryD.where('data', '<=', new Date(filtroFimDespesa));
      queryD.onSnapshot(snapshot => {
        let htmlD = "<tr><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Data</th><th>Fornecedor</th><th>Forma de Pagamento</th><th>Ações</th></tr>";
        snapshot.forEach(doc => {
          const d = doc.data();
          const data = new Date(d.data.seconds * 1000).toLocaleDateString();
          const formaPagamento = d.formaPagamento ? d.formaPagamento.replace('_', ' ').toUpperCase() : 'N/A';
          htmlD += `<tr><td contenteditable onblur="editarCampo('${doc.id}', 'despesas', 'tipo', this)">${d.tipo}</td><td contenteditable onblur="editarCampo('${doc.id}', 'despesas', 'descricao', this)">${d.descricao}</td><td contenteditable onblur="editarCampo('${doc.id}', 'despesas', 'valor', this)">R$${d.valor.toFixed(2)}</td><td>${data}</td><td contenteditable onblur="editarCampo('${doc.id}', 'despesas', 'fornecedor', this)">${d.fornecedor || 'N/A'}</td><td>${formaPagamento}</td><td><button class="icon" onclick="deletarDocumento('despesas', '${doc.id}')">🗑️</button></td></tr>`;
        });
        document.getElementById('tabelaDespesas').innerHTML = htmlD;
        atualizarDashboard();
      });

      // Vendas
      let queryV = db.collection('vendas').orderBy("data", "desc");
      if (filtroInicioVenda) queryV = queryV.where('data', '>=', new Date(filtroInicioVenda));
      if (filtroFimVenda) queryV = queryV.where('data', '<=', new Date(filtroFimVenda));
      queryV.onSnapshot(snapshot => {
        let htmlV = "<tr><th>Produto</th><th>Qtd</th><th>Total</th><th>Data</th></tr>";
        snapshot.forEach(doc => {
          const d = doc.data();
          const data = new Date(d.data.seconds * 1000).toLocaleDateString();
          htmlV += `<tr><td>${d.nome}</td><td>${d.qtd}</td><td>R$${d.total.toFixed(2)}</td><td>${data}</td></tr>`;
        });
        document.getElementById('tabelaVendas').innerHTML = htmlV;
        atualizarDashboard();
      });
    }

    async function atualizarDashboard() {
      const filtroInicioVenda = document.getElementById('filtroDataInicioVenda').value;
      const filtroFimVenda = document.getElementById('filtroDataFimVenda').value;
      const filtroInicioDespesa = document.getElementById('filtroDataInicioDespesa').value;
      const filtroFimDespesa = document.getElementById('filtroDataFimDespesa').value;

      let queryV = db.collection('vendas');
      if (filtroInicioVenda) queryV = queryV.where('data', '>=', new Date(filtroInicioVenda));
      if (filtroFimVenda) queryV = queryV.where('data', '<=', new Date(filtroFimVenda));
      const snapshotV = await queryV.get();

      let queryD = db.collection('despesas');
      if (filtroInicioDespesa) queryD = queryD.where('data', '>=', new Date(filtroInicioDespesa));
      if (filtroFimDespesa) queryD = queryD.where('data', '<=', new Date(filtroFimDespesa));
      const snapshotD = await queryD.get();

      const totalVendas = snapshotV.docs.reduce((sum, doc) => sum + doc.data().total, 0);
      const totalDespesas = snapshotD.docs.reduce((sum, doc) => sum + doc.data().valor, 0);
      const lucroLiquido = totalVendas - totalDespesas;
      document.getElementById('lucroLiquido').innerText = `Lucro Líquido: R$ ${lucroLiquido.toFixed(2)}`;

      atualizarGraficos(snapshotV, snapshotD);
    }

    async function editarCampo(id, colecao, campo, elemento) {
      let valor = elemento.innerText.replace(/[R$%]/g, '').trim();
      if (!valor) return mostrarErro('erro' + colecao.charAt(0).toUpperCase() + colecao.slice(1), 'Campo não pode ser vazio.');
      if (campo === 'valor' || campo === 'custo' || campo === 'margem' || campo === 'estoque') {
        valor = parseFloat(valor);
        if (isNaN(valor) || valor < 0) return mostrarErro('erro' + colecao.charAt(0).toUpperCase() + colecao.slice(1), 'Valor deve ser um número não negativo.');
      }
      await db.collection(colecao).doc(id).update({ [campo]: valor });
    }

    function exportarTabela(tipo) {
      const id = tipo === 'hamburguers' ? 'tabelaHamburguers' : 'tabelaDespesas';
      const table = document.getElementById(id);
      const wb = XLSX.utils.table_to_book(table, { sheet: tipo });
      XLSX.writeFile(wb, `${tipo}.xlsx`);

      const csv = tableToCSV(table);
      downloadCSV(csv, `${tipo}.csv`);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text(`Relatório: ${tipo}`, 10, 10);
      doc.autoTable({ html: `#${id}` });
      doc.save(`${tipo}.pdf`);
    }

    function tableToCSV(table) {
      const rows = Array.from(table.querySelectorAll('tr'));
      const csv = rows.map(row => {
        const cols = Array.from(row.querySelectorAll('th, td')).map(col => `"${col.innerText.replace(/"/g, '""')}"`);
        return cols.join(',');
      }).join('\n');
      return csv;
    }

    function downloadCSV(csv, filename) {
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    async function exportarRelatorioConsolidado() {
      const snapshotH = await db.collection('hamburguers').get();
      const snapshotD = await db.collection('despesas').get();
      const snapshotV = await db.collection('vendas').orderBy("data", "desc").get();

      const wb = XLSX.utils.book_new();

      const hamburguersData = snapshotH.docs.map(doc => {
        const d = doc.data();
        return [d.nome, d.custo.toFixed(2), d.margem, d.preco.toFixed(2), d.lucroUn.toFixed(2), d.estoque];
      });
      const wsH = XLSX.utils.aoa_to_sheet([['Nome', 'Custo (R$)', 'Margem (%)', 'Preço (R$)', 'Lucro (R$)', 'Estoque'], ...hamburguersData]);
      XLSX.utils.book_append_sheet(wb, wsH, 'Hamburguers');

      const despesasData = snapshotD.docs.map(doc => {
        const d = doc.data();
        const data = new Date(d.data.seconds * 1000).toLocaleDateString();
        const formaPagamento = d.formaPagamento ? d.formaPagamento.replace('_', ' ').toUpperCase() : 'N/A';
        return [d.tipo, d.descricao, d.valor.toFixed(2), data, d.fornecedor || 'N/A', formaPagamento];
      });
      const wsD = XLSX.utils.aoa_to_sheet([['Tipo', 'Descrição', 'Valor (R$)', 'Data', 'Fornecedor', 'Forma de Pagamento'], ...despesasData]);
      XLSX.utils.book_append_sheet(wb, wsD, 'Despesas');

      const vendasData = snapshotV.docs.map(doc => {
        const d = doc.data();
        const data = new Date(d.data.seconds * 1000).toLocaleDateString();
        return [d.nome, d.qtd, d.total.toFixed(2), data];
      });
      const wsV = XLSX.utils.aoa_to_sheet([['Produto', 'Quantidade', 'Total (R$)', 'Data'], ...vendasData]);
      XLSX.utils.book_append_sheet(wb, wsV, 'Vendas');

      const totalVendas = snapshotV.docs.reduce((sum, doc) => sum + doc.data().total, 0);
      const totalDespesas = snapshotD.docs.reduce((sum, doc) => sum + doc.data().valor, 0);
      const lucroLiquido = totalVendas - totalDespesas;
      const resumoData = [
        ['Total Vendas (R$)', totalVendas.toFixed(2)],
        ['Total Despesas (R$)', totalDespesas.toFixed(2)],
        ['Lucro Líquido (R$)', lucroLiquido.toFixed(2)]
      ];
      const wsR = XLSX.utils.aoa_to_sheet([['Item', 'Valor'], ...resumoData]);
      XLSX.utils.book_append_sheet(wb, wsR, 'Resumo');

      XLSX.writeFile(wb, 'relatorio_consolidado.xlsx');

      const csv = [
        'Hambúrgueres\n' + tableToCSV(document.getElementById('tabelaHamburguers')),
        'Despesas\n' + tableToCSV(document.getElementById('tabelaDespesas')),
        'Vendas\n' + tableToCSV(document.getElementById('tabelaVendas')),
        'Resumo\nItem,Valor\n' +
        `Total Vendas (R$),${totalVendas.toFixed(2)}\n` +
        `Total Despesas (R$),${totalDespesas.toFixed(2)}\n` +
        `Lucro Líquido (R$),${lucroLiquido.toFixed(2)}`
      ].join('\n');
      downloadCSV(csv, 'relatorio_consolidado.csv');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text('Relatório Consolidado - BurgzGo', 10, 10);
      doc.autoTable({ html: '#tabelaHamburguers', startY: 20 });
      doc.addPage();
      doc.text('Despesas', 10, 10);
      doc.autoTable({ html: '#tabelaDespesas' });
      doc.addPage();
      doc.text('Vendas', 10, 10);
      doc.autoTable({ html: '#tabelaVendas' });
      doc.addPage();
      doc.text('Resumo', 10, 10);
      doc.autoTable({
        head: [['Item', 'Valor']],
        body: resumoData
      });
      doc.save('relatorio_consolidado.pdf');
    }

    async function calcularLucroMensal() {
      const mesAno = document.getElementById('filtroMesLucro').value;
      if (!mesAno) return;

      const [ano, mes] = mesAno.split('-');
      const dataInicio = new Date(ano, mes - 1, 1);
      const dataFim = new Date(ano, mes, 0);

      const snapshotV = await db.collection('vendas')
        .where('data', '>=', dataInicio)
        .where('data', '<=', dataFim)
        .get();
      const snapshotD = await db.collection('despesas')
        .where('data', '>=', dataInicio)
        .where('data', '<=', dataFim)
        .get();

      const totalVendas = snapshotV.docs.reduce((sum, doc) => sum + doc.data().total, 0);
      const totalDespesas = snapshotD.docs.reduce((sum, doc) => sum + doc.data().valor, 0);
      const lucroMensal = totalVendas - totalDespesas;

      alert(`Lucro Mensal (${mes}/${ano}): R$ ${lucroMensal.toFixed(2)}`);
    }

    async function gerarBackup() {
      const snapshotH = await db.collection('hamburguers').get();
      const snapshotD = await db.collection('despesas').get();
      const snapshotV = await db.collection('vendas').get();

      const backupData = {
        hamburguers: snapshotH.docs.map(doc => ({ id: doc.id, ...doc.data() })),
        despesas: snapshotD.docs.map(doc => ({ id: doc.id, ...doc.data() })),
        vendas: snapshotV.docs.map(doc => ({ id: doc.id, ...doc.data() }))
      };

      const json = JSON.stringify(backupData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const ref = storage.ref(`backups/backup-${timestamp}.json`);

      await ref.put(blob);
      alert('Backup gerado e salvo no Firebase Storage!');
    }

    function atualizarGraficos(snapshotV, snapshotD) {
      const meses = [];
      const lucros = [];
      const despesas = [];

      const vendasPorMes = {};
      snapshotV.forEach(doc => {
        const data = new Date(doc.data().data.seconds * 1000);
        const mesAno = `${data.getMonth() + 1}/${data.getFullYear()}`;
        vendasPorMes[mesAno] = (vendasPorMes[mesAno] || 0) + doc.data().total;
      });

      const despesasPorMes = {};
      snapshotD.forEach(doc => {
        const data = new Date(doc.data().data.seconds * 1000);
        const mesAno = `${data.getMonth() + 1}/${data.getFullYear()}`;
        despesasPorMes[mesAno] = (despesasPorMes[mesAno] || 0) + doc.data().valor;
      });

      const todosMeses = [...new Set([...Object.keys(vendasPorMes), ...Object.keys(despesasPorMes)])].sort();
      todosMeses.forEach(mes => {
        meses.push(mes);
        lucros.push(vendasPorMes[mes] || 0);
        despesas.push(despesasPorMes[mes] || 0);
      });

      if (chartLucros) chartLucros.destroy();
      chartLucros = new Chart(document.getElementById('graficoLucros'), {
        type: 'line',
        data: {
          labels: meses,
          datasets: [{
            label: 'Receita (R$)',
            data: lucros,
            borderColor: '#FFD700',
            backgroundColor: 'rgba(255, 215, 0, 0.2)',
            fill: true
          }]
        },
        options: { scales: { y: { beginAtZero: true } } }
      });

      if (chartDespesas) chartDespesas.destroy();
      chartDespesas = new Chart(document.getElementById('graficoDespesas'), {
        type: 'bar',
        data: {
          labels: meses,
          datasets: [{
            label: 'Despesas (R$)',
            data: despesas,
            backgroundColor: '#8B0000'
          }]
        },
        options: { scales: { y: { beginAtZero: true } } }
      });
    }
  </script>
